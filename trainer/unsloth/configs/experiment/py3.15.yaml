# @package _global_
# Testing config: runs with any model= override. Not for real training runs.
# Swap the model on the command line:
#   satyrn-unsloth --config-name experiment/py3.15 model=qwen3.6-27b
defaults:
  - /defaults
  - /model: ornith-1.5-9b
  - _self_

run_name: py3.15-${basename:${model.name}}

mlflow:
  experiment_name: ${basename:${model.name}}

load_in_4bit: false
logging_steps: 1

datasets:
  cpt: datasets/python3.15/cpt.jsonl
  sft:
    - datasets/python3.14/sft.jsonl
    - datasets/python3.14/sft-PEP750.jsonl
    - datasets/python3.15/sft.jsonl
    - datasets/python3.15/sft2.jsonl
    - datasets/opencode-reasoning/opencode_reasoning_split1.jsonl
    - datasets/opencode-reasoning/opencode_reasoning_split2.jsonl
    - datasets/opencode-reasoning/opencode_reasoning_split3.jsonl
    - datasets/opencode-reasoning/opencode_reasoning_split4.jsonl

cpt:
  seq_len: 4096
  batch_size: 8
  num_train_epochs: 3
  learning_rate: 1e-4

sft:
  seq_len: 1280
  batch_size: 8
  num_train_epochs: 2
  learning_rate: 2e-4
