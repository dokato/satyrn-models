# @package _global_
defaults:
  - /defaults
  - /model: mellum2-12b-a2.5
  - _self_

run_name: py-mellum2-12b-a2.5

mlflow:
  experiment_name: Mellum2-12B-A2.5B-Instruct

datasets:
  cpt:
    - datasets/python3.14/cpt.jsonl
    - datasets/python3.15/cpt.jsonl
  sft:
    - datasets/python3.14/sft.jsonl
    - datasets/python3.14/sft-PEP750.jsonl
    - datasets/python3.15/sft.jsonl
    - datasets/python3.15/sft2.jsonl
    - datasets/opencode-reasoning/opencode_reasoning_split1.jsonl
    - datasets/opencode-reasoning/opencode_reasoning_split2.jsonl
    - datasets/opencode-reasoning/opencode_reasoning_split3.jsonl
    - datasets/opencode-reasoning/opencode_reasoning_split4.jsonl

cpt:
  seq_len: 4096
  batch_size: 8
  eval_batch_size: 8
  num_train_epochs: 4
  prepack_dataset: true

sft:
  seq_len: 1280
  batch_size: 32
  eval_batch_size: 8
  num_train_epochs: 5
